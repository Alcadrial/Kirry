
import org.gradle.internal.os.OperatingSystem

switch (OperatingSystem.current()) {
	case OperatingSystem.LINUX:
		def osArch = System.getProperty("os.arch")
		ext.lwjglNatives = osArch.startsWith("arm") || osArch.startsWith("aarch64") ? "natives-linux-${osArch.contains("64") || osArch.startsWith("armv8") ? "arm64" : "arm32"}" : "natives-linux"
		break
	case OperatingSystem.MAC_OS:
		ext.lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
		break
	case OperatingSystem.WINDOWS:
		def osArch = System.getProperty("os.arch")
		ext.lwjglNatives = osArch.contains("64") ? "natives-windows${osArch.startsWith("aarch64") ? "-arm64" : ""}" : "natives-windows-x86"
		break
}

def applicationAttributes(distributionName, mainClass, libsDirectory)
{
	return [
			"Specification-Title"		: "${name} ${distributionName}",
			"Specification-Version"		: version,
			"Specification-Vendor"		: author,
			"Implementation-Title"		: "${name} ${distributionName}",
			"Implementation-Version"	: version,
			"Implementation-Vendor"		: author,
			"Implementation-Timestamp"	: new Date().format("dd/MM/yyyy HH:mm:ss"),
			"Main-Class"				: "${mainClass}",
			"Class-Path"				: "${fileTree(libsDirectory).filter{ it.isFile() }.files.name.toString().replace('[', 'lib/').replace(', ', ' lib/').replace(']', '')}"
	]
}