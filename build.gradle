import org.gradle.internal.os.OperatingSystem

plugins {
    id("java")
    id("java-library")
    id("maven-publish")
    id("eclipse")
}

group = "com.alcadrial.renderengine"

eclipse.project.name = "${name}"
println("Configuring ${name}'s project")

ext.lwjglVersion = "3.3.1"

switch (OperatingSystem.current()) {
	case OperatingSystem.LINUX:
		def osArch = System.getProperty("os.arch")
		ext.lwjglNatives = osArch.startsWith("arm") || osArch.startsWith("aarch64")
			? "natives-linux-${osArch.contains('64') || osArch.startsWith('armv8') ? 'arm64' : 'arm32'}"
			: "natives-linux"
		break
	case OperatingSystem.MAC_OS:
		ext.lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
		break
	case OperatingSystem.WINDOWS:
		def osArch = System.getProperty("os.arch")
		ext.lwjglNatives = osArch.contains("64")
			? "natives-windows${osArch.startsWith('aarch64') ? '-arm64' : ''}"
			: "natives-windows-x86"
		break
}

subprojects {
    apply plugin: "java"

	group = "com.alcadrial.renderengine"
	archivesBaseName = "${name}-${moduleName}-${version}"
	
	java {
		toolchain.languageVersion = JavaLanguageVersion.of(17)
		withSourcesJar()
		withJavadocJar()
		modularity.inferModulePath = true
	}
	
	javadoc {
		options.tags("apiNote:a:API Note:", "implSpec:a:Implementation Requirements:", "implNote:a:Implementation Note:")
		options.addBooleanOption('html5', true)
	}
	
	compileJava.options.encoding = "UTF-8"
	
	boolean printExcludedFiles = true
	boolean printExportedFiles = true
	boolean excludeTestFiles = true
	boolean printOnlyOnce = true
	
	sourceSets {
		main {
			resources {
				exclude("*")
			}
			java {
				
				File start = null
				
				exclude(e -> {
					if (printOnlyOnce)
					{
						if (start == null) start = e.getFile()
						else if (start.equals(e.getFile()))
						{
							printExportedFiles = false
							printExcludedFiles = false
						}
					}
					if (!excludeTestFiles || e.getFile().isDirectory()) {
						File packageFile = new File(e.getFile().getPath() + "/package-info.java")
						if (packageFile.isFile())
						{
							String text = packageFile.text
							boolean b0 = text.contains("@Test")
							boolean b1 = text.contains("import com.alcadrial.renderengine.core.util.Test")
							boolean b2 = text.contains("package com.alcadrial.renderengine.core.util;")
							boolean b3 = text.contains("@com.alcadrial.renderengine.core.util.Test")
							boolean r = b3 || (b0 && b2) || (b0 && b1)
							if (!r && printExportedFiles) println("P " + e.getFile())
							if (r && printExcludedFiles) println("excluded P " + e.getFile())
							return r
						}
						if (printExportedFiles) println("D " + e.getFile())
						return false
					}
					boolean b = e.getFile().name.endsWith(".java")
					String text = e.getFile().text
					boolean b0 = text.contains("@Test")
					boolean b1 = text.contains("import com.alcadrial.renderengine.core.util.Test")
					boolean b2 = text.contains("package com.alcadrial.renderengine.core.util;")
					boolean b3 = text.contains("@com.alcadrial.renderengine.core.util.Test")
					boolean result = b && ((b0 && (b1 || b2)) || b3)
					if (printExportedFiles && !result) println("F " + e.getFile())
					if (printExcludedFiles && result) println("excluded F " + e.getFile())
					return result
				})
			}
		}
	}

	tasks.sourcesJar {
	    duplicatesStrategy = "exclude"
	}
    
    repositories {
		flatDir {
			dirs("../libs")
		}
	    maven {
	    	name = "Local Maven"
	    	url "D:/maven"
	    }
        mavenCentral()
    }
	
	jar.manifest.attributes([
		"Specification-Title"     : "${name} ${moduleName}",
		"Specification-Version"   : version,
		"Specification-Vendor"    : author,
		"Implementation-Title"    : "${name} ${moduleName}",
		"Implementation-Version"  : version,
		"Implementation-Vendor"   : author,
		"Implementation-Timestamp": new Date().format("dd/MM/yyyy HH:mm:ss")
	])
}