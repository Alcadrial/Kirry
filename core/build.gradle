plugins {
	id("java")
	id("java-library")
	id("maven-publish")
	id("eclipse")
}

apply from: rootProject.file("pre.gradle")

javadoc.options.tags("apiNote::API Note:", "implSpec::Implementation Requirements:", "implNote::Implementation Note:")

dependencies {
	implementation(libs.kector)
	
	implementation(libs.lwjgl)
	implementation(libs.lwjgl.glfw)
	runtimeOnly("org.lwjgl:lwjgl::${lwjglNatives}")
	runtimeOnly("org.lwjgl:lwjgl-glfw::${lwjglNatives}")
}


apply from: rootProject.file("post.gradle")

publishing {
	publications {
		release(MavenPublication) {
			artifactId = "$project.name"
			artifact(jar)
		}
	}
}