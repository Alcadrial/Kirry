plugins {
	id("java")
	id("java-library")
	id("maven-publish")
	id("com.alcadrial.klug") version "0.2.3"
}

eclipse.project.name = "RenderEngine Core"

javadoc.options.tags("apiNote::API Note:", "implSpec::Implementation Requirements:", "implNote::Implementation Note:")
	
dependencies {
	implementation("com.alcadrial.kector:Kector:${kectorVersion}")
	
	implementation ("org.lwjgl:lwjgl:${lwjglVersion}")
	implementation ("org.lwjgl:lwjgl-glfw:${lwjglVersion}")
	runtimeOnly ("org.lwjgl:lwjgl::${lwjglNatives}")
	runtimeOnly ("org.lwjgl:lwjgl-glfw::${lwjglNatives}")
} 

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
			artifact sourcesJar
			artifact javadocJar
		}
	}
	repositories {
		if (klug.localMaven != null) {
			maven {
				name = "LocalMaven"
				url = klug.localMaven
			}
		}
		if (klug.remoteMaven != null) {
			maven {
				name = "RemoveMaven"
				url = klug.remoteMaven
				credentials {
					username = klug.remoteMavenUsername
					password = klug.remoteMavenPassword
				}
			}
		}
	}
}