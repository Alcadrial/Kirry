
jar.manifest.attributes([
	"Specification-Title"     : "${rootProject.name} $name",
	"Specification-Version"   : version,
	"Specification-Vendor"    : author,
	"Implementation-Title"    : "${rootProject.name} $name",
	"Implementation-Version"  : version,
	"Implementation-Vendor"   : author,
	"Implementation-Timestamp": new Date().format("dd/MM/yyyy HH:mm:ss")
])

publishing {
	repositories {
		if (localMaven != null) {
			maven {
				name = "LocalMaven"
				url = localMaven
			}
		}
		if (remoteMaven != null) {
			maven {
				name = "RemoveMaven"
				url = remoteMaven
				credentials {
					username = remoteMavenUsername
					password = remoteMavenPassword
				}
			}
		}
	}
}