pluginManagement {

	repositories {
		if (localMaven != null) {
			maven {
				name = "LocalMaven"
				url = localMaven
			}
		}
		if (remoteMaven != null) {
			maven {
				name = "RemoveMaven"
				url = remoteMaven
				credentials {
					username = remoteMavenUsername
					password = remoteMavenPassword
				}
			}
		}
		maven {
			url "https://plugins.gradle.org/m2/"
		}
	}
}

rootProject.name="RenderEngine"
include("core", "opengl", "vulkan", "audio")

import org.gradle.internal.os.OperatingSystem
switch (OperatingSystem.current()) {
	case OperatingSystem.LINUX:
		def osArch = System.getProperty("os.arch")
		ext.lwjglNatives = osArch.startsWith("arm") || osArch.startsWith("aarch64")
			? "natives-linux-${osArch.contains("64") || osArch.startsWith("armv8") ? "arm64" : "arm32"}"
			: "natives-linux"
		break
	case OperatingSystem.MAC_OS:
		ext.lwjglNatives = System.getProperty("os.arch").startsWith("aarch64") ? "natives-macos-arm64" : "natives-macos"
		break
	case OperatingSystem.WINDOWS:
		def osArch = System.getProperty("os.arch")
		ext.lwjglNatives = osArch.contains("64")
			? "natives-windows${osArch.startsWith("aarch64") ? "-arm64" : ""}"
			: "natives-windows-x86"
		break
}
