plugins {
	id("java")
	id("application")
	id("java-library")
	id("maven-publish")
	id("com.alcadrial.klug") version "0.2.1"
}

eclipse.project.name = "RenderEngine Vulkan"

klugDebug.enableDebug = true

compileJava.options.encoding = "UTF-8"

javadoc {
	options.tags("renderengine.vulkan:a:Vulkan API:", "renderengine.Requires:a:Requires:", "renderengine.Optional:a:Optional:")
	options.encoding = "UTF-8"
}

dependencies {
	implementation(project(":core"))
	
	implementation("com.alcadrial.kector:Kector:${kectorVersion}")
	implementation("com.alcadrial.kroperties:Kroperties:${kropertiesVersion}")
	implementation("com.alcadrial.threads:Threads:${threadsVersion}")
	implementation("com.alcadrial.kurvilinear:KurviLinear:${kurvilinearVersion}")
	
	implementation("com.google.code.gson:gson:${gsonVersion}")
	implementation("org.lwjgl:lwjgl:${lwjglVersion}")
	implementation("org.lwjgl:lwjgl-glfw:${lwjglVersion}")
	implementation("org.lwjgl:lwjgl-openal:${lwjglVersion}")
	implementation("org.lwjgl:lwjgl-vma:${lwjglVersion}")
	implementation("org.lwjgl:lwjgl-vulkan:${lwjglVersion}")
	runtimeOnly("org.lwjgl:lwjgl::${lwjglNatives}")
	runtimeOnly("org.lwjgl:lwjgl-glfw::${lwjglNatives}")
	runtimeOnly("org.lwjgl:lwjgl-openal::${lwjglNatives}")
	runtimeOnly("org.lwjgl:lwjgl-vma::${lwjglNatives}")
	if (lwjglNatives == "natives-macos" || lwjglNatives == "natives-macos-arm64") runtimeOnly("org.lwjgl:lwjgl-vulkan::${lwjglNatives}")
}

boolean printExcludedFiles = true
boolean printExportedFiles = true
boolean excludeTestFiles = true
boolean printOnlyOnce = true

sourceSets {
	main {
		resources {
			exclude("*")
		}
		java {
			File start = null
			
			exclude(e -> {
				if (printOnlyOnce)
				{
					if (start == null) start = e.getFile()
					else if (start.equals(e.getFile()))
					{
						printExportedFiles = false
						printExcludedFiles = false
					}
				}
				if (!excludeTestFiles || e.getFile().isDirectory()) {
					File packageFile = new File(e.getFile().getPath() + "/package-info.java")
					if (packageFile.isFile())
					{
						String text = packageFile.text
						boolean b0 = text.contains("@Test")
						boolean b1 = text.contains("import com.alcadrial.renderengine.core.util.Test")
						boolean b2 = text.contains("package com.alcadrial.renderengine.core.util;")
						boolean b3 = text.contains("@com.alcadrial.renderengine.core.util.Test")
						boolean r = b3 || (b0 && b2) || (b0 && b1)
						if (!r && printExportedFiles) println("P " + e.getFile())
						if (r && printExcludedFiles) println("excluded P " + e.getFile())
						return r
					}
					if (printExportedFiles) println("D " + e.getFile())
					return false
				}
				boolean b = e.getFile().name.endsWith(".java")
				String text = e.getFile().text
				boolean b0 = text.contains("@Test")
				boolean b1 = text.contains("import com.alcadrial.renderengine.core.util.Test")
				boolean b2 = text.contains("package com.alcadrial.renderengine.core.util;")
				boolean b3 = text.contains("@com.alcadrial.renderengine.core.util.Test")
				boolean result = b && ((b0 && (b1 || b2)) || b3)
				if (printExportedFiles && !result) println("F " + e.getFile())
				if (printExcludedFiles && result) println("excluded F " + e.getFile())
				return result
			})
		}
	}
}

task applicationZip(type: Zip) {
	archiveClassifier = "application"
	duplicatesStrategy = "include"
	
	from(jar)
	mkdir("${buildDir}/resources/zip/lib")
	mkdir("${buildDir}/resources/zip/resources")
	copy {
		from(configurations.runtimeClasspath)
		into("${buildDir}/resources/zip/lib")
	}
	copy {
		from("src/main/resources")
		into("${buildDir}/resources/zip/resources")
	}
	from("${buildDir}/resources/zip")
	
	doLast {
		delete("${buildDir}/resources/zip")
	}
}

ext.applicationAttributes = { distributionName, mainClass, libsDirectory ->
	return [
			"Specification-Title"		: "${name} ${distributionName}",
			"Specification-Version"		: version,
			"Specification-Vendor"		: author,
			"Implementation-Title"		: "${name} ${distributionName}",
			"Implementation-Version"	: version,
			"Implementation-Vendor"		: author,
			"Implementation-Timestamp"	: new Date().format("dd/MM/yyyy HH:mm:ss"),
			"Main-Class"				: "${mainClass}",
			"Class-Path"				: "${fileTree(libsDirectory).filter{ it.isFile() }.files.name.toString().replace('[', 'lib/').replace(', ', ' lib/').replace(']', '')}"
	]
}
	
tasks.jar {
	def libBuildDir = mkdir("${buildDir}/resources/jar/lib")
	copy {
		from(configurations.runtimeClasspath)
		into(libBuildDir)
	}
	manifest.attributes(applicationAttributes("app", "com.alcadrial.renderengine.render.test.DepthBufferTest", libBuildDir))
	delete(libBuildDir)
	dependsOn(":core:jar")
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact jar
			artifact applicationZip
			artifact sourcesJar
			artifact javadocJar
		}
	}
	repositories {
		maven {
			url("file://D:/maven")
		}
	}
}