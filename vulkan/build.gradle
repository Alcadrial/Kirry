plugins {
	id("java")
	id("application")
	id("java-library")
	id("maven-publish")
	id("eclipse")
}

apply from: rootProject.file("pre.gradle")

java {
	toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

dependencies {
	implementation(project(":core"))
	
	implementation(libs.kector.new)
	implementation(libs.kroperties)
	
	implementation(libs.bundles.jackson.and.eclipse.collections)
	implementation(libs.jspecify)
	implementation(libs.lwjgl)
	implementation(libs.lwjgl.freetype)
	implementation(libs.lwjgl.glfw)
	implementation(libs.lwjgl.stb)
	implementation(libs.lwjgl.vulkan)
	runtimeOnly("org.lwjgl:lwjgl::${lwjglNatives}")
	runtimeOnly("org.lwjgl:lwjgl-freetype::${lwjglNatives}")
	runtimeOnly("org.lwjgl:lwjgl-glfw::${lwjglNatives}")
	runtimeOnly("org.lwjgl:lwjgl-stb::${lwjglNatives}")
	if (lwjglNatives == "natives-macos" || lwjglNatives == "natives-macos-arm64") runtimeOnly("org.lwjgl:lwjgl-vulkan::${lwjglNatives}")
	
	implementation(libs.lwjgl.renderdoc)
}

sourceSets {
	debug {
		java {
			
		}
	}
	release {
		java {
			
		}
	}
	main {
		resources {
			
		}
		java {
			
		}
	}
}

configurations {
	debugImplementation.extendsFrom(implementation)
	releaseImplementation.extendsFrom(implementation)
}

apply from: rootProject.file("post.gradle")

javadoc.options.tags("kirry.vulkan:a:Vulkan API:", "kirry.Requires:a:Requires:", "kirry.Optional:a:Optional:")

task debugJavadoc(type: Javadoc) {
    source(sourceSets.main.allJava)
    source(sourceSets.debug.allJava)
    classpath = sourceSets.debug.compileClasspath
    destinationDir = reporting.file("debugJavadoc")
    options.tags("kirry.vulkan:a:Vulkan API:", "kirry.Requires:a:Requires:", "kirry.Optional:a:Optional:")
}

task javadocDebugJar(type: Jar, dependsOn: debugJavadoc) {
	archiveBaseName = "${archiveBaseName.get()}-debug"
    archiveClassifier = "javadoc"
	from(debugJavadoc.destinationDir)
}

task sourcesDebugJar(type: Jar, dependsOn: debugClasses) {
	archiveBaseName = "${archiveBaseName.get()}-debug"
    archiveClassifier = "sources"
    from(compileDebugJava.source)
}

tasks.compileDebugJava {
	source(sourceSets.main.java)
}

task debugJar(type: Jar)
{
	archiveBaseName = "${archiveBaseName.get()}-debug"
	from(sourceSets.debug.output)
}

task testJar(type: Jar)
{
	archiveBaseName = "${archiveBaseName.get()}-debug"
	archiveClassifier = "test"
	from(sourceSets.debug.output)
	from(sourceSets.test.output)
	from(sourceSets.main.resources)
}

task releaseJavadoc(type: Javadoc) {
    source(sourceSets.main.allJava)
    source(sourceSets.release.allJava)
    classpath = sourceSets.release.compileClasspath
    destinationDir = reporting.file("releaseJavadoc")
    options.tags("kirry.vulkan:a:Vulkan API:", "kirry.Requires:a:Requires:", "kirry.Optional:a:Optional:")
}

task javadocReleaseJar(type: Jar, dependsOn: releaseJavadoc) {
	archiveBaseName = "${archiveBaseName.get()}-release"
    archiveClassifier = "javadoc"
	from(releaseJavadoc.destinationDir)
}

task sourcesReleaseJar(type: Jar, dependsOn: releaseClasses) {
	archiveBaseName = "${archiveBaseName.get()}-release"
    archiveClassifier = "sources"
    from(compileReleaseJava.source)
}

tasks.compileReleaseJava {
	source(sourceSets.main.java)
}

tasks.compileJava {
	source(sourceSets.release.java)
}

task releaseJar(type: Jar)
{
	archiveBaseName = "${archiveBaseName.get()}-release"
	from(sourceSets.release.output)
}

publishing {
	publications {
		debug(MavenPublication) {
			artifactId = "$project.name-debug"
			artifact(debugJar)
			artifact(javadocDebugJar)
			artifact(sourcesDebugJar)
			artifact(testJar)
		}
		release(MavenPublication) {
			artifactId = "$project.name-release"
			artifact(releaseJar)
			artifact(javadocReleaseJar)
			artifact(sourcesReleaseJar)
		}
	}
}